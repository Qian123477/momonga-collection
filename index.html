<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>小桃圖鑑</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>


<body>


    <!-- =========================================
         頂部橫幅
         ========================================= -->

    <div class="top-banner">

        <img
            src="小桃圖鑑image/モモンガ.png"
            alt="小桃橫幅"
        >

    </div>



    <!-- =========================================
         收藏統計區
         ========================================= -->

    <div class="progress-section">

        <div class="progress-grid">


            <!-- 娃娃 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    娃娃
                </div>

                <div class="progress-card-count">

                    <span id="plush-collected">
                        0
                    </span>

                    /

                    <span id="plush-total">
                        0
                    </span>

                </div>

                <div
                    class="progress-card-percentage"
                    id="plush-percentage"
                >
                    0%
                </div>

            </div>



            <!-- 其他周邊 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    其他周邊
                </div>

                <div class="progress-card-count">

                    <span id="other-collected">
                        0
                    </span>

                    /

                    <span id="other-total">
                        0
                    </span>

                </div>

                <div
                    class="progress-card-percentage"
                    id="other-percentage"
                >
                    0%
                </div>

            </div>



            <!-- 收藏總數 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    收藏總數
                </div>

                <div class="progress-card-count">

                    <span id="total-collected">
                        0
                    </span>

                    <span class="unit">
                        件
                    </span>

                </div>

                <div class="progress-card-percentage">
                    我的收藏
                </div>

            </div>



            <!-- 收藏總花費 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    收藏總花費
                </div>

                <div
                    class="progress-card-price"
                    id="total-spent"
                >
                    NT$ 0
                </div>

                <div class="progress-card-percentage">
                    累計購入
                </div>

            </div>


        </div>

    </div>



    <!-- =========================================
         商品圖鑑
         
         JavaScript 會自動把 products.json
         裡面的商品產生在這裡
         ========================================= -->

    <main id="catalog-container"></main>



    <!-- =========================================
         JavaScript
         ========================================= -->

    <script src="script.js?v=7"></script>


</body>

</html>
