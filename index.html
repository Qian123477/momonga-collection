<!DOCTYPE html>

    <title>小桃圖鑑</title>
    <link rel="stylesheet" href="style.css">

<body>
    <!-- 頂部專屬橫幅 (細長型) -->
    <div class="top-banner">
        <!-- 記得確認你的圖片檔名和資料夾路徑是否正確喔 -->
        <img src="小桃圖鑑image/モモンガ.png" alt="小桃橫幅">

    <!-- 進度區塊 -->
    <div class="progress-section">
        <div class="character-progress">
            <div class="avatar">
                <img src="momo_head.jpg" alt="小桃">
            </div>
            <div class="name">小桃總進度</div>
            <div class="count">
                <span id="collected-count">0</span> / <span id="total-count">0</span>
            </div>
        </div>
    </div>
    
    <h2 class="major-title">🧸 娃娃系列</h2>

    <h3 class="sub-title">吊飾</h3>

            <div class="item" data-id="momo_plush_jp_01">

                <label><input type="checkbox" class="collect-checkbox"> 可動坐姿</label>
            </div>
