<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- 防止重新整理時瀏覽器先顯示淺色 -->
    <meta
        name="color-scheme"
        content="light dark"
    >

    <title>小桃圖鑑</title>


    <!-- =========================================
         Google Analytics 4
         ========================================= -->

    <script
        async
        src="https://www.googletagmanager.com/gtag/js?id=G-660GP1CJB3"
    ></script>

    <script>

        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag(
            'js',
            new Date()
        );

        gtag(
            'config',
            'G-660GP1CJB3'
        );

    </script>


    <!-- =========================================
         網站分享預覽
         ========================================= -->

    <meta
        property="og:title"
        content="小桃圖鑑"
    >

    <meta
        property="og:description"
        content="小桃周邊收藏圖鑑"
    >

    <meta
        property="og:image"
        content="https://qian123477.github.io/momonga-collection/image/social-preview.png"
    >

    <meta
        property="og:url"
        content="https://qian123477.github.io/momonga-collection/"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="小桃圖鑑"
    >


    <!-- =========================================
         Twitter / X 分享預覽
         ========================================= -->

    <meta
        name="twitter:card"
        content="summary_large_image"
    >

    <meta
        name="twitter:title"
        content="小桃圖鑑"
    >

    <meta
        name="twitter:description"
        content="小桃周邊收藏圖鑑"
    >

    <meta
        name="twitter:image"
        content="https://qian123477.github.io/momonga-collection/image/social-preview.png"
    >


    <!--
        =====================================================
        防止深色模式重新整理時閃白
        =====================================================

        這段一定要放在 style.css 前面。

        網頁還沒開始畫面之前，
        先讀取之前記住的深色模式。

        這樣重新整理時就會直接以深色開始，
        不會先出現白色再變黑。
    -->

    <script>
        (function () {

            try {

                /*
                 * 你的網站原本如果使用 theme = dark，
                 * 這裡會直接讀取。
                 */
                const theme =
                    localStorage.getItem("theme");

                if (theme === "dark") {

                    document.documentElement.classList.add(
                        "dark-mode"
                    );

                }

            } catch (error) {

                /*
                 * 如果瀏覽器禁止 localStorage，
                 * 不影響網站正常運作。
                 */
                console.warn(
                    "無法讀取主題設定",
                    error
                );

            }

        })();
    </script>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         頂部橫幅
         ========================================= -->

    <div class="top-banner">

        <img
            src="image/モモンガ.png"
            alt="小桃橫幅"
        >

    </div>



    <!-- =========================================
         收藏統計區
         ========================================= -->

    <div class="progress-section">

        <div class="progress-grid">


            <!-- 娃娃 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    娃娃
                </div>

                <div class="progress-card-count">

                    <span id="plush-collected">
                        0
                    </span>

                    /

                    <span id="plush-total">
                        0
                    </span>

                </div>

                <div
                    class="progress-card-percentage"
                    id="plush-percentage"
                >
                    0%
                </div>

            </div>



            <!-- 其他周邊 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    其他周邊
                </div>

                <div class="progress-card-count">

                    <span id="other-collected">
                        0
                    </span>

                    /

                    <span id="other-total">
                        0
                    </span>

                </div>

                <div
                    class="progress-card-percentage"
                    id="other-percentage"
                >
                    0%
                </div>

            </div>



            <!-- 收藏總數 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    收藏總數
                </div>

                <div class="progress-card-count collection-total-count">

                    <span id="total-collected">
                        0
                    </span>

                    <span class="unit">
                        款
                    </span>

                    <span class="count-separator">
                        ·
                    </span>

                    <span id="total-items">
                        0
                    </span>

                    <span class="unit">
                        件
                    </span>

                </div>

                <div class="progress-card-percentage">
                    我的收藏
                </div>

            </div>



            <!-- 收藏總花費 -->

            <div class="progress-card">

                <div class="progress-card-title">
                    收藏總花費
                </div>

                <div
                    class="progress-card-price"
                    id="total-spent"
                >
                    NT$ 0
                </div>

                <div class="progress-card-percentage">
                    累計購入
                </div>

            </div>


        </div>

    </div>



    <!-- =========================================
         搜尋與篩選
         ========================================= -->

    <div class="catalog-tools">


        <!-- 搜尋 -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>

            <input
                type="search"
                id="search-input"
                placeholder="搜尋小桃………………"
                autocomplete="off"
            >

            <button
                type="button"
                id="clear-search"
                class="clear-search"
                aria-label="清除搜尋"
            >
                ×
            </button>

        </div>



        <!-- 篩選 -->

        <div class="filter-buttons">

            <button
                type="button"
                class="filter-button active"
                data-filter="all"
            >
                全部
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="collected"
            >
                已收藏
            </button>

            <button
                type="button"
                class="filter-button"
                data-filter="uncollected"
            >
                未收藏
            </button>

        </div>



        <!-- 搜尋結果 -->

        <div
            id="search-result-message"
            class="search-result-message"
        ></div>


    </div>



    <!-- =========================================
         商品圖鑑
         ========================================= -->

    <main id="catalog-container"></main>



    <!-- =========================================
         設定按鈕
         ========================================= -->

    <button
        type="button"
        id="settings-button"
        class="settings-button"
        aria-label="開啟設定"
    >
        ⚙️
    </button>



    <!-- =========================================
         設定視窗
         ========================================= -->

    <div
        id="settings-overlay"
        class="settings-overlay"
    >

        <div
            class="settings-panel"
            role="dialog"
            aria-modal="true"
        >


            <!-- 設定標題 -->

            <div class="settings-header">

                <h2>
                    ⚙️ 設定
                </h2>

                <button
                    type="button"
                    id="close-settings"
                    class="close-settings"
                    aria-label="關閉設定"
                >
                    ×
                </button>

            </div>



            <!-- 深色模式 -->

            <div class="settings-item">

                <div class="settings-item-text">

                    <strong>
                        🌙 深色模式
                    </strong>

                    <span>
                        切換網站顏色
                    </span>

                </div>


                <button
                    type="button"
                    id="theme-toggle"
                    class="theme-toggle"
                >

                    <span class="theme-toggle-icon">
                        🌙
                    </span>

                    <span class="theme-toggle-text">
                        深色
                    </span>

                </button>

            </div>



            <!-- 清除收藏 -->

            <div class="settings-item danger-item">

                <div class="settings-item-text">

                    <strong>
                        🗑 清除收藏資料
                    </strong>

                    <span>
                        清除所有收藏與購入價格
                    </span>

                </div>


                <button
                    type="button"
                    id="clear-data-button"
                    class="clear-data-button"
                >
                    清除
                </button>

            </div>


        </div>

    </div>



    <!-- =========================================
         清除資料確認視窗
         ========================================= -->

    <div
        id="confirm-overlay"
        class="confirm-overlay"
    >

        <div class="confirm-panel">

            <div class="confirm-icon">
                ⚠️
            </div>

            <h2>
                確定要清除嗎？
            </h2>

            <p>
                這會清除所有收藏狀態、數量與購入價格。<br>
                商品圖鑑本身不會被刪除。
            </p>


            <div class="confirm-buttons">

                <button
                    type="button"
                    id="cancel-clear"
                    class="cancel-button"
                >
                    取消
                </button>

                <button
                    type="button"
                    id="confirm-clear"
                    class="confirm-clear-button"
                >
                    確定清除
                </button>

            </div>

        </div>

    </div>



    <!-- =========================================
         JavaScript
         ========================================= -->

    <script src="script.js?v=12"></script>


</body>

</html>
