<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小桃圖鑑</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌟 小桃圖鑑</h1>

    <div class="progress-section">
        <div class="character-progress">
            <div class="avatar">
                <img src="momo00.jpg" alt="小桃">
            </div>
            <div class="name">小桃</div>
            <div class="count">
                <span id="collected-count">0</span> / <span id="total-count">0</span>
            </div>
        </div>
    </div>
    
    <div class="catalog-grid">
        <div class="item" data-id="momonga_001">
            <img src="momo1.jpg" alt="圖片">
            <label>
                <input type="checkbox" class="collect-checkbox"> 初代睡衣小桃
            </label>
        </div>

        <div class="item" data-id="momonga_002">
            <img src="momo2.jpg" alt="圖片">
            <label>
                <input type="checkbox" class="collect-checkbox"> 魔法少女小桃
            </label>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
